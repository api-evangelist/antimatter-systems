aid: antimatter-systems
name: Antimatter Systems
description: 'Antimatter Systems is an education technology company building a peer-to-peer learning
  network where students demonstrate mastery by making memes, puzzles, and games rather than by writing
  essays or sitting tests. Founded by Jonathan Libov, the company raised a $2M seed round led by Version
  One Ventures in 2023, joined by Spacecadet, Ordinary Holdings, Haystack and Compound. Its classroom
  product lets teachers create meme-based activities with deadlines and instructions, invite students by
  shareable link, moderate submissions, restrict learners to view-only, work from a library of
  pre-approved templates, catch unedited-image uploads with plagiarism detection, and grade every
  submission in one place; the company states it should be free for schools. Antimatter also ships a
  Sorcerer AI instructional coach plus the consumer Antimatter: Creator and Antimatter: Universe iOS
  apps. The platform runs on the web at playantimatter.com. As of July 2026 the company publishes no
  public API, developer portal, SDKs, or machine-readable API specifications.'
